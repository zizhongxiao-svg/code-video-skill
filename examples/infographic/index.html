<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#141a4a; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const FPS = 30, DUR = 12;
const W = 1920, H = 1080;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const SANS = '"Noto Sans CJK SC", sans-serif', MONO = '"Noto Sans Mono CJK SC", monospace';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b) => ease((t - a) / (b - a));
const back = x => { x = clamp(x); const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261018);
const STARS = Array.from({ length: 170 }, () => ({ x: rnd() * 2400, y: rnd() * H, r: 0.8 + rnd() * 2.2, p: rnd() * 6.28, d: 0.2 + rnd() * 0.8 }));
const GALAXY = Array.from({ length: 70 }, (_, i) => ({ a: rnd() * 6.28, r: Math.pow(rnd(), 0.7), arm: i % 2 }));

// items: log10(years)
const ITEMS = [
  { L: Math.log10(80), name: '人的一生', num: '约 80 年', col: '#ffb45c', up: true, icon: 'life' },
  { L: Math.log10(5000), name: '有文字的历史', num: '约 5 000 年', col: '#6fe3c1', up: false, icon: 'scroll' },
  { L: Math.log10(3e5), name: '智人出现', num: '约 30 万年前', col: '#ff8fb1', up: true, icon: 'fire' },
  { L: Math.log10(6.6e7), name: '恐龙灭绝', num: '6 600 万年前', col: '#a6e35b', up: false, icon: 'dino' },
  { L: Math.log10(4.54e9), name: '地球形成', num: '45.4 亿年前', col: '#5ec8ff', up: true, icon: 'earth' },
  { L: Math.log10(1.38e10), name: '宇宙年龄', num: '约 138 亿年', col: '#c39bff', up: false, icon: 'galaxy' },
];
const MULT = ['×62', '×60', '×220', '×69', '×3'];
const POP = [0.45, 1.85, 3.3, 4.8, 6.25, 7.35];
const DEC = ['10 年', '100 年', '1000 年', '1 万年', '10 万年', '100 万年', '1000 万年', '1 亿年', '10 亿年', '100 亿年'];

// camera: center log value c, px per decade z
const ZW = 470, ZF = 1700 / 9.7, CF = 5.82;
const MOVES = [[1.0, 1.95, 0], [2.45, 3.4, 1], [3.9, 4.95, 2], [5.4, 6.35, 3], [6.75, 7.45, 4]];
function camera(t) {
  const cOf = i => ITEMS[i].L - 0.32;
  let c = cOf(0);
  for (const [a, b, i] of MOVES) if (t >= a) c = lerp(cOf(i), cOf(i + 1), prog(t, a, b));
  const zo = prog(t, 7.9, 9.0);
  return { c: lerp(c, CF, zo), z: Math.exp(lerp(Math.log(ZW), Math.log(ZF), zo)), zo };
}

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(clamp(v * k, 0, 255)); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }

// ---- icons, drawn in a unit badge of radius R centered at origin ----
function icon(kind, R, t, col) {
  g.save();
  if (kind === 'life') {
    g.fillStyle = '#ff6f61'; rr(-0.42 * R, 0.02 * R, 0.84 * R, 0.62 * R, 0.3 * R); g.fill();
    g.fillStyle = '#ffe2c4'; circ(0, -0.3 * R, 0.36 * R); g.fill();
    g.fillStyle = '#5a3a2a'; g.beginPath(); g.arc(0, -0.36 * R, 0.37 * R, Math.PI * 1.02, Math.PI * 1.98); g.fill();
    g.fillStyle = '#2b2440'; circ(-0.12 * R, -0.26 * R, 0.045 * R); g.fill(); circ(0.12 * R, -0.26 * R, 0.045 * R); g.fill();
    g.strokeStyle = '#2b2440'; g.lineWidth = 0.04 * R; g.lineCap = 'round'; g.beginPath(); g.arc(0, -0.16 * R, 0.09 * R, 0.2, Math.PI - 0.2); g.stroke();
    g.fillStyle = 'rgba(255,120,120,0.55)'; circ(-0.22 * R, -0.16 * R, 0.06 * R); g.fill(); circ(0.22 * R, -0.16 * R, 0.06 * R); g.fill();
  } else if (kind === 'scroll') {
    g.fillStyle = '#fff1cf'; rr(-0.42 * R, -0.42 * R, 0.84 * R, 0.84 * R, 0.08 * R); g.fill();
    g.fillStyle = '#e9c98a'; rr(-0.5 * R, -0.5 * R, 1.0 * R, 0.16 * R, 0.08 * R); g.fill(); rr(-0.5 * R, 0.36 * R, 1.0 * R, 0.16 * R, 0.08 * R); g.fill();
    g.fillStyle = '#5b4a7a';
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { if ((i * 3 + j) % 5 === 4) continue; rr(-0.3 * R + j * 0.16 * R, -0.24 * R + i * 0.15 * R, (j % 2 ? 0.07 : 0.1) * R, 0.06 * R, 0.03 * R); g.fill(); }
  } else if (kind === 'fire') {
    g.fillStyle = '#8a5a3c'; g.save(); g.rotate(0.35); rr(-0.48 * R, 0.24 * R, 0.96 * R, 0.16 * R, 0.08 * R); g.fill(); g.restore();
    g.save(); g.rotate(-0.35); rr(-0.48 * R, 0.24 * R, 0.96 * R, 0.16 * R, 0.08 * R); g.fill(); g.restore();
    const fl = (s, c, ph) => { const k = 1 + 0.06 * Math.sin(t * 9 + ph); g.fillStyle = c; g.beginPath();
      g.moveTo(0, -0.62 * R * s * k); g.bezierCurveTo(0.36 * R * s, -0.2 * R * s, 0.34 * R * s, 0.3 * R * s, 0, 0.3 * R * s);
      g.bezierCurveTo(-0.34 * R * s, 0.3 * R * s, -0.36 * R * s, -0.2 * R * s, 0, -0.62 * R * s * k); g.fill(); };
    g.save(); g.translate(0, 0.02 * R); fl(1, '#ff7a3d', 0); fl(0.68, '#ffc24a', 1.7); fl(0.36, '#fff1a8', 3.1); g.restore();
  } else if (kind === 'dino') {
    g.fillStyle = '#4fbf6a';
    g.beginPath(); g.ellipse(-0.05 * R, 0.12 * R, 0.36 * R, 0.24 * R, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(-0.36 * R, 0.08 * R); g.quadraticCurveTo(-0.62 * R, 0.1 * R, -0.66 * R, 0.34 * R); g.quadraticCurveTo(-0.5 * R, 0.24 * R, -0.3 * R, 0.26 * R); g.fill();
    rr(0.12 * R, -0.42 * R, 0.17 * R, 0.6 * R, 0.08 * R); g.fill();
    g.beginPath(); g.ellipse(0.28 * R, -0.42 * R, 0.2 * R, 0.13 * R, 0, 0, 7); g.fill();
    rr(-0.26 * R, 0.24 * R, 0.12 * R, 0.24 * R, 0.05 * R); g.fill(); rr(0.06 * R, 0.24 * R, 0.12 * R, 0.24 * R, 0.05 * R); g.fill();
    g.fillStyle = '#2b2440'; circ(0.33 * R, -0.46 * R, 0.035 * R); g.fill();
    g.fillStyle = '#86e08f'; g.beginPath(); g.ellipse(-0.05 * R, 0.2 * R, 0.24 * R, 0.1 * R, 0, 0, 7); g.fill();
    const mt = (t * 0.6) % 1;
    g.save(); g.translate((0.62 - 0.1 * mt) * R, (-0.62 + 0.1 * mt) * R); g.rotate(-0.8);
    const tg = g.createLinearGradient(0, 0, 0, -0.5 * R); tg.addColorStop(0, 'rgba(255,170,80,0.9)'); tg.addColorStop(1, 'rgba(255,170,80,0)');
    g.fillStyle = tg; g.beginPath(); g.moveTo(-0.09 * R, 0); g.lineTo(0, -0.5 * R); g.lineTo(0.09 * R, 0); g.fill();
    g.fillStyle = '#ffb35c'; circ(0, 0, 0.1 * R); g.fill(); g.restore();
  } else if (kind === 'earth') {
    circ(0, 0, 0.5 * R); g.fillStyle = '#2f7fe0'; g.fill();
    g.save(); circ(0, 0, 0.5 * R); g.clip();
    const sh = (t * 0.06) % 1 * R;
    g.fillStyle = '#5bd17a';
    for (const [x, y, rx, ry] of [[-0.2, -0.2, 0.2, 0.14], [0.18, 0.05, 0.16, 0.22], [-0.12, 0.26, 0.12, 0.09], [0.82, -0.2, 0.2, 0.14]]) {
      g.beginPath(); g.ellipse(x * R - sh, y * R, rx * R, ry * R, 0.4, 0, 7); g.fill();
      g.beginPath(); g.ellipse(x * R - sh + R, y * R, rx * R, ry * R, 0.4, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(10,20,60,0.28)'; circ(0.2 * R, 0.16 * R, 0.5 * R); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.55)'; circ(-0.22 * R, -0.24 * R, 0.08 * R); g.fill();
  } else if (kind === 'galaxy') {
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, 0.55 * R); rg.addColorStop(0, 'rgba(255,240,255,1)'); rg.addColorStop(0.25, 'rgba(220,170,255,0.8)'); rg.addColorStop(1, 'rgba(160,110,255,0)');
    g.fillStyle = rg; circ(0, 0, 0.55 * R); g.fill();
    const rot = t * 0.5;
    for (const s of GALAXY) {
      const rr0 = s.r * 0.52 * R, a = s.a * 0.15 + s.r * 4 + s.arm * Math.PI + rot;
      g.fillStyle = s.arm ? '#ffe3ff' : '#c9e6ff'; circ(Math.cos(a) * rr0, Math.sin(a) * rr0 * 0.62, (1.2 + 2.6 * (1 - s.r)) * R / 70); g.fill();
    }
  }
  g.restore();
}

function badge(x, y, R, it, t) {
  g.save();
  g.fillStyle = 'rgba(8,6,30,0.35)'; circ(x + 0.06 * R, y + 0.1 * R, R); g.fill();
  circ(x, y, R); g.fillStyle = shade(it.col, 0.38); g.fill();
  circ(x, y, R * 0.86); g.fillStyle = shade(it.col, 0.62); g.fill();
  g.translate(x, y); icon(it.icon, R * 1.15, t, it.col);
  g.restore();
}

function card(it, x, ay, k, a, t) {
  if (a <= 0) return;
  const p = back(a), R = 66 * k;
  const dir = it.up ? -1 : 1, stem = 54 * k;
  g.save(); g.globalAlpha = clamp(a * 3);
  g.strokeStyle = it.col; g.lineWidth = 5 * k; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, ay); g.lineTo(x, ay + dir * stem * clamp(a * 2)); g.stroke();
  circ(x, ay, 13 * k * p); g.fillStyle = '#fff'; g.fill(); circ(x, ay, 8 * k * p); g.fillStyle = it.col; g.fill();
  const by = ay + dir * (stem + R);
  // card body pops from the badge
  g.translate(x, by); g.scale(p, p); g.translate(-x, -by);
  badge(x, by, R, it, t);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `700 ${56 * k}px ${MONO}`; const wn = g.measureText(it.num).width;
  g.font = `700 ${40 * k}px ${SANS}`; const hw = Math.max(wn, g.measureText(it.name).width) / 2;
  let tx = x;
  if (tx < 40 + hw) tx = Math.min(40 + hw, x + hw - 70);
  if (tx > W - 40 - hw) tx = Math.max(W - 40 - hw, x - hw + 70);
  if (it.up) {
    g.font = `700 ${56 * k}px ${MONO}`; g.fillStyle = it.col; g.fillText(it.num, tx, by - R - 22 * k);
    g.font = `700 ${40 * k}px ${SANS}`; g.fillStyle = '#ffffff'; g.fillText(it.name, tx, by - R - 88 * k);
  } else {
    g.font = `700 ${40 * k}px ${SANS}`; g.fillStyle = '#ffffff'; g.fillText(it.name, tx, by + R + 54 * k);
    g.font = `700 ${56 * k}px ${MONO}`; g.fillStyle = it.col; g.fillText(it.num, tx, by + R + 118 * k);
  }
  g.restore();
}

window.__info = { fps: FPS, duration: DUR, frames: Math.round(FPS * DUR) };
window.__render = t => {
  const cam = camera(t), XL = L => 960 + (L - cam.c) * cam.z;
  // background
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#101a52'); bg.addColorStop(0.55, '#24196a'); bg.addColorStop(1, '#3c1c6e');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (const [x, y, r, c] of [[300, 220, 520, 'rgba(90,120,255,0.16)'], [1600, 860, 620, 'rgba(200,90,255,0.14)'], [1200, 140, 380, 'rgba(80,200,255,0.08)']]) {
    const rg = g.createRadialGradient(x - cam.c * 12, y, 0, x - cam.c * 12, y, r); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  for (const s of STARS) {
    const x = ((s.x - cam.c * 40 * s.d) % 2400 + 2400) % 2400 - 240;
    g.fillStyle = `rgba(255,255,255,${0.25 + 0.45 * s.d * (0.6 + 0.4 * Math.sin(t * 2.2 + s.p))})`;
    circ(x, s.y, s.r * 0.8); g.fill();
  }

  const ay = lerp(560, 468, cam.zo), k = lerp(1, 0.8, cam.zo);
  const axA = prog(t, 0.0, 0.5);
  // axis
  const x0 = XL(0.82), x1 = XL(10.62);
  g.save(); g.globalAlpha = axA;
  const ag = g.createLinearGradient(XL(1), 0, XL(10.3), 0);
  ag.addColorStop(0, '#ffb45c'); ag.addColorStop(0.35, '#ff8fb1'); ag.addColorStop(0.7, '#5ec8ff'); ag.addColorStop(1, '#c39bff');
  rr(x0, ay - 7, x1 - x0, 14, 7); g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
  rr(x0, ay - 7, x1 - x0, 14, 7); g.fillStyle = ag; g.fill();
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  for (let d = 1; d <= 10; d++) {
    const x = XL(d); if (x < -100 || x > W + 100) continue;
    circ(x, ay, 6 * k + 1); g.fillStyle = '#ffffff'; g.fill();
    g.font = `500 ${lerp(32, 28, cam.zo)}px ${MONO}`; g.fillStyle = 'rgba(225,225,255,0.72)';
    const near = up => ITEMS.some(it => it.up === up && Math.abs(XL(it.L) - x) < (up ? 70 : 80));
    if (!near(false)) g.fillText(DEC[d - 1], x, ay + 46);
    else if (!near(true)) g.fillText(DEC[d - 1], x, ay - 24);
  }
  g.restore();

  // multiplier chips
  const ma = 1 - prog(t, 7.9, 8.3);
  for (let i = 0; i < 5; i++) {
    const a = prog(t, POP[i + 1] + 0.2, POP[i + 1] + 0.5) * ma; if (a <= 0) continue;
    const x = (XL(ITEMS[i].L) + XL(ITEMS[i + 1].L)) / 2;
    g.save(); g.globalAlpha = a; g.font = `700 36px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = g.measureText(MULT[i]).width + 34;
    rr(x - w / 2, ay - 27, w, 54, 27); g.fillStyle = '#ffffff'; g.fill();
    g.fillStyle = '#2a1d6e'; g.fillText(MULT[i], x, ay + 2); g.restore();
  }

  ITEMS.forEach((it, i) => card(it, XL(it.L), ay, k, (t - POP[i]) / 0.5, t));

  // title
  g.save(); g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.globalAlpha = prog(t, 0, 0.5);
  g.font = `900 60px ${SANS}`; g.fillStyle = '#ffffff'; g.fillText('时间有多长？', 120, 112);
  g.font = `500 34px ${SANS}`; g.fillStyle = 'rgba(220,220,255,0.75)'; g.fillText('对数时间轴：每往右一格，时间长 10 倍', 124, 166);
  g.restore();

  // ending
  const ea = prog(t, 9.2, 9.8), eb = prog(t, 9.8, 10.4), ec = prog(t, 10.4, 11.4);
  if (ea > 0) {
    g.save(); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.globalAlpha = ea; g.font = `700 46px ${SANS}`; g.fillStyle = '#ffffff';
    g.fillText('把 138 亿年压成 1 年，', 120, 900 + (1 - ea) * 20);
    g.globalAlpha = eb; g.translate(0, (1 - eb) * 20);
    g.fillText('人类文明只占最后', 120, 990);
    const w = g.measureText('人类文明只占最后').width;
    g.font = `700 92px ${MONO}`; g.fillStyle = '#ffd166'; g.fillText('11', 120 + w + 16, 996);
    const w2 = g.measureText('11').width;
    g.font = `700 46px ${SANS}`; g.fillText('秒', 120 + w + 28 + w2, 990);
    g.restore();
    // year bar
    const bx = 1020, bw = 760, byy = 930;
    g.save(); g.globalAlpha = ea;
    rr(bx, byy - 16, bw, 32, 16); g.fillStyle = 'rgba(255,255,255,0.14)'; g.fill();
    const yg = g.createLinearGradient(bx, 0, bx + bw, 0); yg.addColorStop(0, '#c39bff'); yg.addColorStop(0.67, '#5ec8ff'); yg.addColorStop(1, '#ffd166');
    rr(bx, byy - 16, Math.max(32, bw * ec), 32, 16); g.fillStyle = yg; g.fill();
    g.font = `500 30px ${MONO}`; g.fillStyle = 'rgba(225,225,255,0.8)'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillText('1 月 1 日 大爆炸', bx, byy + 60);
    g.textAlign = 'right'; g.fillText('12 月 31 日 24:00', bx + bw, byy + 60);
    // earth formation mark: 9 月 2 日
    const ex = bx + bw * (244.92 / 365), em = prog(t, 10.4 + 0.67, 10.4 + 0.9);
    g.globalAlpha = ea * em; g.fillStyle = '#5ec8ff'; circ(ex, byy, 9); g.fill();
    g.textAlign = 'center'; g.font = `500 28px ${MONO}`; g.fillText('9 月 2 日 地球形成', ex, byy - 34);
    const fa = prog(t, 11.3, 11.6);
    g.globalAlpha = fa; g.strokeStyle = '#ffd166'; g.lineWidth = 4; circ(bx + bw - 6, byy, 22 + 6 * Math.sin(t * 8)); g.stroke();
    g.restore();
  }

  g.save(); g.font = `400 22px ${SANS}`; g.fillStyle = 'rgba(230,230,255,0.4)'; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillText('数据信息图 demo · 代码逐帧渲染', 40, 1056); g.restore();
  return { seg: 'infographic', tau: t.toFixed(2) };
};
Promise.all([`700 40px ${SANS}`, `900 60px ${SANS}`, `500 34px ${SANS}`, `700 56px ${MONO}`, `500 30px ${MONO}`, `400 22px ${SANS}`].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready).then(() => { window.__render(0); window.__ready = true; });
</script>
</body>
</html>
