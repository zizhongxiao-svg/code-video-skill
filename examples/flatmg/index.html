<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#2ec4b6; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const FPS = 30, DUR = 12;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"Noto Sans CJK SC", sans-serif';
const PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const easeIn = x => { x = clamp(x); return x * x * x; };
const back = x => { x = clamp(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const prog = (t, a, b) => ease((t - a) / (b - a));
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const spring = dt => dt < 0 ? 0 : Math.exp(-dt * 10) * Math.cos(dt * 24);
const hopY = (k, h) => -4 * h * k * (1 - k);

const C = { navy: '#1f2a50', navy2: '#2d3c70', teal: '#2ec4b6', sun: '#ffbe3d', coral: '#ff6b5b', sky: '#45b8f2', violet: '#7b61ff', pink: '#ff8fb1', aqua: '#dff7ff', white: '#ffffff' };
const BG = [C.teal, C.sun, C.coral, C.sky, C.violet, C.pink];
const PANS = [[1.55, 2.0], [3.45, 3.9], [5.05, 5.5], [6.85, 7.3], [8.45, 8.9]];
const camX = t => PANS.reduce((x, [a, b]) => x + 1920 * ease((t - a) / (b - a)), 0);

// ---------- flat primitives (fill only, no outlines) ----------
function circle(x, y, r, c) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, PI * 2); g.fillStyle = c; g.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, PI * 2); g.fillStyle = c; g.fill(); }
function rr(x, y, w, h, r, c) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = c; g.fill(); }
function poly(p, c) { g.beginPath(); p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fillStyle = c; g.fill(); }
function text(s, x, y, size, c, w = 700, align = 'center') { g.font = `${w} ${size}px ${FONT}`; g.fillStyle = c; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y); }

function eyes(x, y, sep, s, type, look = [0, 0]) {
  for (const d of [-1, 1]) {
    const ex = x + d * sep;
    if (type === 'blink') rr(ex - s * .9, y - s * .14, s * 1.8, s * .28, s * .14, C.navy);
    else if (type === 'happy') { g.beginPath(); g.arc(ex, y + s * .35, s * .85, PI, 0); g.arc(ex, y + s * .35, s * .42, 0, PI, true); g.closePath(); g.fillStyle = C.navy; g.fill(); }
    else if (type === 'dizzy') { g.save(); g.translate(ex, y); for (const a of [.785, -.785]) { g.save(); g.rotate(a); rr(-s * .85, -s * .15, s * 1.7, s * .3, s * .15, C.navy); g.restore(); } g.restore(); }
    else {
      const big = type === 'wow' ? 1.18 : 1; ell(ex, y, s * .82 * big, s * big, C.white);
      const pr = s * (type === 'wow' ? .32 : .5), px = ex + look[0] * s * .32, py = y + look[1] * s * .4;
      circle(px, py, pr, C.navy); circle(px + pr * .35, py - pr * .4, pr * .36, C.white);
    }
  }
}
function mouth(x, y, s, type) {
  g.fillStyle = C.navy;
  if (type === 'o') ell(x, y, s * .3, s * .38, C.navy);
  else if (type === 'grin') { g.beginPath(); g.ellipse(x, y - s * .15, s * .62, s * .55, 0, 0, PI); g.fill(); }
  else if (type === 'flat') rr(x - s * .32, y - s * .08, s * .64, s * .16, s * .08, C.navy);
  else { g.beginPath(); g.ellipse(x, y - s * .08, s * .42, s * .34, 0, 0, PI); g.fill(); }
}
// hero bottle, origin = bottom centre
function bottle(x, y, s, o = {}) {
  g.save(); g.translate(x, y);
  ell(0, 4 * s, 70 * s, 12 * s, 'rgba(0,0,0,.13)');
  g.rotate(o.rot || 0); g.scale(s * (o.sx || 1), s * (o.sy || 1));
  g.beginPath(); g.moveTo(-60, -150); g.quadraticCurveTo(-60, -212, -25, -222); g.lineTo(25, -222); g.quadraticCurveTo(60, -212, 60, -150);
  g.lineTo(60, -26); g.quadraticCurveTo(60, 0, 34, 0); g.lineTo(-34, 0); g.quadraticCurveTo(-60, 0, -60, -26); g.closePath(); g.fillStyle = C.aqua; g.fill();
  rr(-25, -246, 50, 30, 4, C.aqua); rr(-31, -238, 62, 10, 5, '#bfe9f7');
  rr(-30, -274, 60, 36, 9, C.coral); g.fillStyle = '#e4503f'; for (let i = 0; i < 4; i++) g.fillRect(-22 + i * 13, -268, 6, 24);
  g.fillStyle = C.violet; g.fillRect(-60, -90, 120, 44); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(-60, -90, 120, 8);
  rr(-49, -172, 13, 120, 6.5, 'rgba(255,255,255,.9)');
  eyes(0, -142, 25, 19, o.eye || 'open', o.look || [0, 0]);
  mouth(0, -110, 24, o.mouth || 'smile');
  ell(-43, -113, 9, 6, 'rgba(255,110,140,.55)'); ell(43, -113, 9, 6, 'rgba(255,110,140,.55)');
  g.restore();
}
function flake(x, y, s, rot, o = {}) {
  g.save(); g.translate(x, y);
  ell(0, 44 * s + (o.shY || 0), 52 * s, 9 * s, 'rgba(0,0,0,.13)');
  g.rotate(rot); g.scale(s, s);
  poly([[-64, -30], [40, -50], [66, 22], [-30, 46]], C.aqua);
  poly([[-30, 46], [66, 22], [60, 4], [-38, 26]], C.violet);
  poly([[-52, -22], [-8, -32], [-34, -2]], 'rgba(255,255,255,.9)');
  eyes(4, -10, 20, 14, o.eye || 'open', o.look || [0, 0]);
  mouth(4, 12, 17, o.mouth || 'smile');
  g.restore();
}
function blob(x, y, r, t, o = {}) {
  g.save(); g.translate(x, y);
  g.beginPath();
  for (let i = 0; i <= 48; i++) { const a = i / 48 * PI * 2, k = 1 + .05 * Math.sin(3 * a + t * 7) + .035 * Math.sin(5 * a - t * 9); const px = Math.cos(a) * r * k, py = Math.sin(a) * r * k * (o.sy || 1); i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); g.fillStyle = '#ffb703'; g.fill();
  ell(0, r * .45, r * .8, r * .4, '#fb8500');
  ell(-r * .35, -r * .42, r * .22, r * .14, 'rgba(255,255,255,.75)', -.5);
  eyes(0, -r * .12, r * .33, r * .24, o.eye || 'happy', o.look || [0, 0]);
  mouth(0, r * .22, r * .3, o.mouth || 'grin');
  ell(-r * .55, r * .1, r * .12, r * .08, 'rgba(255,90,90,.6)'); ell(r * .55, r * .1, r * .12, r * .08, 'rgba(255,90,90,.6)');
  g.restore();
}
function head(x, y, s, o = {}) {
  circle(x, y, 32 * s, C.white);
  eyes(x + 2 * s, y - 5 * s, 11 * s, 9 * s, o.eye || 'open', o.look || [1, 0]);
  mouth(x + 2 * s, y + 13 * s, 11 * s, o.mouth || 'smile');
}
function recycle(cx, cy, r, w, c) {
  for (let i = 0; i < 3; i++) {
    const a0 = -PI / 2 + i * 2.094 + .3, a1 = a0 + 1.35;
    g.beginPath(); g.arc(cx, cy, r + w / 2, a0, a1); g.arc(cx, cy, r - w / 2, a1, a0, true); g.closePath(); g.fillStyle = c; g.fill();
    const ax = cx + Math.cos(a1) * r, ay = cy + Math.sin(a1) * r, tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);
    poly([[ax + nx * w * 1.1, ay + ny * w * 1.1], [ax - nx * w * 1.1, ay - ny * w * 1.1], [ax + tx * w * 1.5, ay + ty * w * 1.5]], c);
  }
}
function gear(x, y, r, n, rot, c, hub) {
  const st = PI * 2 / n; g.beginPath();
  for (let k = 0; k < n; k++) {
    const b = rot + k * st;
    [[-.3, .78], [-.18, 1], [.18, 1], [.3, .78]].forEach(([da, rf], j) => { const a = b + da * st; (k || j) ? g.lineTo(x + Math.cos(a) * r * rf, y + Math.sin(a) * r * rf) : g.moveTo(x + Math.cos(a) * r * rf, y + Math.sin(a) * r * rf); });
  }
  g.closePath(); g.fillStyle = c; g.fill(); circle(x, y, r * .3, hub);
}
function check(x, y, s, c) { poly([[x - s, y], [x - s * .55, y - s * .45], [x - s * .15, y - s * .05], [x + s * .8, y - s * .95], [x + s * 1.2, y - s * .5], [x - s * .15, y + s * .85]], c); }
function sparkle(x, y, s, c) { poly([[x, y - s], [x + s * .22, y - s * .22], [x + s, y], [x + s * .22, y + s * .22], [x, y + s], [x - s * .22, y + s * .22], [x - s, y], [x - s * .22, y - s * .22]], c); }
function title(n, s, col, a) {
  if (a <= 0) return;
  g.font = `700 48px ${FONT}`; const w = g.measureText(s).width + 130;
  g.save(); g.translate(70, 106); g.scale(back(a), back(a)); g.globalAlpha = clamp(a * 3);
  rr(0, -44, w, 88, 44, C.white); circle(46, 0, 30, col); text(String(n), 46, 2, 38, C.white, 900);
  text(s, 92, 2, 48, C.navy, 700, 'left'); g.restore();
}
function caption(s, x, y, a) {
  if (a <= 0) return;
  g.font = `700 40px ${FONT}`; const w = g.measureText(s).width + 76;
  g.save(); g.globalAlpha = a; rr(x - w / 2, y - 38 + (1 - a) * 16, w, 76, 38, 'rgba(31,42,80,.88)'); text(s, x, y + 2 + (1 - a) * 16, 40, C.white); g.restore();
}

// ---------- background confetti (pops in on the first scene so frame 0 stays clean for the loop) ----------
const DECO = [
  [['ring', 300, 330, 90], ['dots', 1640, 190, 0], ['tri', 430, 860, 70], ['circ', 1760, 930, 60], ['sq', 720, 200, 34]],
  [['circ', 1300, 170, 70], ['ring', 600, 330, 70], ['dots', 160, 930, 0], ['tri', 1260, 990, 56]],
  [['ring', 1520, 300, 100], ['dots', 260, 640, 0], ['circ', 240, 960, 56], ['sq', 1250, 200, 30]],
  [['ring', 1720, 240, 90], ['dots', 110, 420, 0], ['circ', 1000, 200, 56], ['tri', 1060, 990, 54]],
  [['ring', 1620, 210, 90], ['dots', 1720, 800, 0], ['tri', 800, 900, 60], ['circ', 1160, 300, 50]],
  [['ring', 170, 640, 80], ['dots', 1720, 300, 0], ['tri', 1740, 830, 62], ['circ', 230, 940, 52]],
];
function deco(i, t) {
  DECO[i].forEach(([k, x, y, r], j) => {
    const sc = i === 0 ? back((t - 0.18 - 0.06 * j) / 0.4) : 1; if (sc <= 0.001) return;
    g.save(); g.translate(x, y + Math.sin(t * 1.6 + j * 1.3) * 10); g.rotate(t * 0.4 * (j % 2 ? 1 : -1)); g.scale(sc, sc);
    const c = j % 2 ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.2)';
    if (k === 'ring') { g.beginPath(); g.arc(0, 0, r, 0, PI * 2); g.arc(0, 0, r * .66, 0, PI * 2, true); g.fillStyle = c; g.fill(); }
    else if (k === 'circ') circle(0, 0, r, c);
    else if (k === 'tri') poly([[0, -r], [r * .87, r * .5], [-r * .87, r * .5]], c);
    else if (k === 'sq') rr(-r, -r, r * 2, r * 2, r * .3, c);
    else for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) circle((a - 1) * 34, (b - 1) * 34, 7, 'rgba(255,255,255,.35)');
    g.restore();
  });
}

// ---------- S0 投进回收箱 ----------
const BIN_X = 1420;
function binK(t) { return back((t - 0.12) / 0.45); }
const S0 = {
  back(t) {
    const kb = binK(t); if (kb <= 0.001) return;
    const pl = easeOut((t - 0.3) / 0.35); if (pl > 0) { g.fillStyle = C.navy; g.fillRect(BIN_X, 600, 510 * pl, 160); }
    ell(BIN_X, 806, 175 * kb, 22 * kb, 'rgba(0,0,0,.13)');
  },
  front(t) {
    const kb = binK(t);
    if (kb > 0.001) {
      g.save(); g.translate(BIN_X, 800); g.scale(kb, kb); g.translate(-BIN_X, -800);
      poly([[1272, 540], [1568, 540], [1546, 800], [1294, 800]], '#3a5bd9');
      rr(1262, 520, 316, 42, 12, '#2c47b5');
      recycle(BIN_X, 678, 52, 17, C.white);
      const c = clamp((t - 1.66) / 0.32);
      const open = 1.9 * prog(t, 0.92, 1.12) * (1 - easeOut(c)) + (c > 0 && c < 1 ? 0.14 * Math.abs(Math.sin(c * PI * 3)) * (1 - c) : 0);
      g.save(); g.translate(1574, 524); g.rotate(open); rr(-318, -24, 318, 28, 10, '#4a6cf0'); rr(-190, -40, 64, 20, 7, '#4a6cf0'); g.restore();
      g.restore();
    }
    title(1, '投进回收箱', C.teal, (t - 0.3) / 0.4);
  },
};

// ---------- S1 分拣 ----------
const BELT = 760;
const D1 = t => t < 2.79 ? 1000 * (t - 2.2) : t < 3.05 ? 590 : 590 + 1000 * (t - 3.05);
function itemPos(off, t) {
  let x = 360 + D1(t) + off, y = BELT;
  if (x > 1720) { const dt = (x - 1720) / 1000; y = BELT + 2400 * dt * dt; x = 1720 + (x - 1720) * 0.55; }
  return [x, y];
}
function can(x, y) { rr(x - 38, y - 128, 76, 128, 12, '#d6dee8'); g.fillStyle = '#e85d4f'; g.fillRect(x - 38, y - 92, 76, 44); ell(x, y - 126, 34, 9, '#f2f6fa'); rr(x - 26, y - 116, 10, 96, 5, 'rgba(255,255,255,.7)'); }
function carton(x, y) { rr(x - 62, y - 104, 124, 104, 8, '#c98a4b'); g.fillStyle = '#e7b47c'; g.fillRect(x - 11, y - 104, 22, 104); g.fillStyle = '#a86f38'; g.fillRect(x - 62, y - 104, 124, 10); }
function scanLabel(t) {
  const hx = 360 + D1(t);
  if (t > 2.2 && Math.abs(hx - 950) < 120) return 'pet';
  if (Math.abs(itemPos(330, t)[0] - 950) < 120) return '铝罐';
  if (Math.abs(itemPos(660, t)[0] - 950) < 120) return '纸盒';
  return '扫描中';
}
const S1 = {
  back(t) {
    g.fillStyle = '#e0a12a'; for (const x of [430, 900, 1380, 1640]) g.fillRect(x - 12, 800, 24, 300);
    rr(300, BELT, 1440, 46, 23, C.navy);
    g.save(); g.beginPath(); g.roundRect(300, BELT, 1440, 46, 23); g.clip();
    g.fillStyle = C.navy2; const off = ((D1(t) % 90) + 90) % 90; for (let x = 300 - 90 + off; x < 1760; x += 90) g.fillRect(x, BELT + 8, 44, 30);
    g.restore();
    const [cx, cy] = itemPos(330, t), [bx, by] = itemPos(660, t);
    carton(bx, by); can(cx, cy);
  },
  front(t) {
    g.fillStyle = C.navy; g.fillRect(0, 600, 300, 160); rr(282, 584, 46, 192, 12, C.navy2);
    const fl = 0.16 + 0.06 * Math.sin(t * 40);
    poly([[892, 456], [1008, 456], [1040, BELT], [860, BELT]], `rgba(255,255,255,${fl})`);
    rr(858, 440, 26, 320, 8, C.navy); rr(1016, 440, 26, 320, 8, C.navy); rr(846, 418, 208, 36, 12, C.navy);
    const lab = scanLabel(t), ok = lab === 'pet';
    rr(806, 300, 288, 96, 20, ok ? '#22b573' : C.navy);
    if (ok) { check(870, 350, 22, C.white); text('PET 瓶', 980, 350, 44, C.white); } else text(lab, 950, 350, 40, lab === '扫描中' ? 'rgba(255,255,255,.6)' : C.white);
    g.save(); g.translate(1112, 806); g.rotate(-0.75); rr(-16, -50, 32, 66, 8, C.navy2); g.restore();
    if (t > 3.18 && t < 3.6) for (let i = 0; i < 6; i++) { const p = ((t - 3.18) * 3 + i / 6) % 1; circle(1135 + p * 140, 770 - p * 170, 14 + p * 26, `rgba(255,255,255,${(1 - p) * .85})`); }
    g.fillStyle = C.navy; g.fillRect(1560, 120, 370, 180);
    poly([[1458, 424], [1702, 424], [1644, 296], [1516, 296]], C.navy2); rr(1448, 412, 264, 26, 10, C.navy2);
    rr(1680, 860, 230, 260, 20, '#7a86a8'); text('其他', 1795, 950, 40, C.white);
    title(2, '分拣出 PET 瓶', C.sun, (t - 1.95) / 0.4);
  },
};

// ---------- S2 粉碎 ----------
const shake2 = t => (t > 4.38 && t < 4.95) ? Math.sin(t * 90) * 7 * Math.sin((t - 4.38) / 0.57 * PI) : 0;
const S2 = {
  back(t) {
    g.fillStyle = '#d94a3c'; for (const x of [1330, 1700]) g.fillRect(x - 12, 940, 24, 160);
    rr(1150, 900, 800, 46, 23, C.navy);
    g.save(); g.beginPath(); g.rect(1150, 900, 800, 46); g.clip(); g.fillStyle = C.navy2;
    const off = (t * 600) % 90; for (let x = 1150 - 90 + off; x < 1960; x += 90) g.fillRect(x, 908, 44, 30); g.restore();
  },
  front(t) {
    g.fillStyle = C.navy; g.fillRect(0, 120, 980, 180); rr(790, 288, 162, 26, 9, C.navy2);
    g.save(); g.translate(shake2(t), 0);
    poly([[640, 560], [1100, 560], [1020, 650], [720, 650]], '#ffd36e'); rr(624, 544, 492, 28, 12, '#f5b82e');
    rr(690, 640, 360, 270, 28, C.navy);
    g.save(); g.beginPath(); g.roundRect(735, 680, 270, 160, 40); g.fillStyle = '#121a3a'; g.fill(); g.clip();
    const sp = t < 4.3 ? t * 2 : 8.6 + (t - 4.3) * (t < 5 ? 14 : 5);
    gear(816, 760, 64, 10, sp, '#e6ecf5', '#9aa6c4'); gear(926, 760, 64, 10, -sp + .3, '#c3cde0', '#9aa6c4');
    g.restore();
    circle(1010, 870, 10, (t > 4.3 && t < 5) && (t * 6 % 1 < .5) ? '#ff4d4d' : '#4dd68a');
    rr(706, 902, 64, 20, 6, '#121a3a'); rr(970, 902, 64, 20, 6, '#121a3a');
    poly([[1048, 800], [1196, 858], [1196, 890], [1048, 862]], '#ffd36e');
    g.restore();
    title(3, '粉碎成瓶片', C.coral, (t - 3.85) / 0.4);
  },
};
// flakes live in world space so they can ride the belt across into the washing scene
const FLAKES = Array.from({ length: 30 }, (_, i) => ({ te: 4.45 + 0.55 * hash(i), vx: 260 + 520 * hash(i + 1), vy: -480 - 420 * hash(i + 2), s: 14 + 12 * hash(i + 3), r0: hash(i + 4) * 6, col: [C.aqua, '#bfefff', C.white, C.violet, '#ffd36e'][i % 5] }));
function drawFlakes(t) {
  for (const f of FLAKES) {
    const dt = t - f.te; if (dt < 0) continue;
    const dl = (-f.vy + Math.sqrt(f.vy * f.vy + 4 * 1500 * 26)) / 3000;
    const fly = Math.min(dt, dl);
    let x = 3840 + 1196 + f.vx * fly + 600 * Math.max(0, dt - dl), y = 868 + f.vy * fly + 1500 * fly * fly;
    let a = 1;
    if (x > 5760 + 360) { const k = (x - 6120) / 600; y = 894 + k * 160; x = 6120 + (x - 6120) * 0.5; a = clamp(1 - k * 1.4); }
    if (a <= 0) continue;
    g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(f.r0 + fly * 9);
    poly([[-f.s, -f.s * .5], [f.s * .7, -f.s * .8], [f.s, f.s * .45], [-f.s * .4, f.s * .7]], f.col); g.restore();
  }
}

// ---------- S3 清洗、熔融 ----------
const heat = t => prog(t, 6.4, 6.7);
const S3 = {
  back(t) {
    rr(-40, 900, 400, 46, 23, C.navy);
    g.save(); g.beginPath(); g.rect(0, 900, 360, 46); g.clip(); g.fillStyle = C.navy2;
    const off = (t * 600) % 90; for (let x = -90 + off; x < 380; x += 90) g.fillRect(x, 908, 44, 30); g.restore();
    const h = heat(t);
    if (h > 0) { g.save(); g.globalAlpha = h; ell(1375, 560, 250, 70, 'rgba(255,183,3,.45)'); g.restore(); }
    for (let i = 0; i < 3; i++) { const f = 1 + .15 * Math.sin(t * 22 + i * 2); poly([[1260 + i * 115, 965], [1230 + i * 115, 930 - 30 * f], [1260 + i * 115, 870 - 40 * f], [1290 + i * 115, 930 - 30 * f]], i % 2 ? '#ffd166' : '#ff9f1c'); }
  },
  front(t) {
    g.beginPath(); g.moveTo(390, 655);
    for (let x = 390; x <= 870; x += 12) g.lineTo(x, 652 + Math.sin(x * .035 + t * 6) * 7);
    g.lineTo(870, 930); g.lineTo(390, 930); g.closePath(); g.fillStyle = 'rgba(214,246,255,.78)'; g.fill();
    for (let i = 0; i < 12; i++) { const p = (t * .9 + hash(i + 30)) % 1; circle(420 + hash(i) * 420 + Math.sin(p * 9 + i) * 10, 920 - p * 260, 6 + 10 * hash(i + 60), `rgba(255,255,255,${.9 * (1 - p)})`); }
    g.fillStyle = C.navy; g.fillRect(360, 600, 30, 360); g.fillRect(870, 600, 30, 360); g.fillRect(360, 930, 540, 30);
    rr(1150, 570, 450, 330, [20, 20, 150, 150], C.navy);
    const h = heat(t);
    rr(1130, 552, 490, 40, 14, h > 0 ? `rgb(${lerp(45, 230, h) | 0},${lerp(60, 90, h) | 0},${lerp(112, 60, h) | 0})` : C.navy2);
    for (let i = 0; i < 3; i++) rr(1160, 640 + i * 70, 430, 18, 9, h > 0 ? `rgba(255,${150 - i * 20},40,${0.35 + 0.65 * h})` : C.navy2);
    g.fillStyle = C.navy; g.fillRect(1600, 780, 330, 80);
    if (h > 0) { g.save(); g.globalAlpha = h * .8; g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 7; g.lineCap = 'round';
      for (let i = 0; i < 3; i++) { g.beginPath(); for (let k = 0; k <= 10; k++) { const y = 520 - k * 16 - ((t * 120) % 40), x = 1290 + i * 85 + Math.sin(k * .9 + t * 8 + i) * 10; k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
      g.restore(); }
    caption('加热到 250°C 以上，熔成液体', 1375, 1020, prog(t, 6.45, 6.75));
    title(4, '清洗、熔融', C.sky, (t - 5.45) / 0.4);
  },
};

// ---------- S4 抽丝 ----------
const HOLES = Array.from({ length: 8 }, (_, i) => 480 + i * 51);
const G4 = [660, 600];
const S4 = {
  back(t) {
    g.fillStyle = C.navy; g.fillRect(0, 780, 260, 80); g.fillRect(180, 200, 80, 660); g.fillRect(180, 200, 260, 80);
    rr(420, 120, 480, 182, 22, C.navy); g.fillStyle = '#3b4a80'; g.fillRect(440, 300, 440, 24);
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(440, 330, 440, 230);
    g.fillStyle = 'rgba(255,255,255,.28)';
    for (let i = 0; i < 6; i++) { const x = 440 + ((t * 500 + i * 160) % 520) - 80; g.fillRect(Math.max(440, x), 350 + i * 34, Math.min(80, 880 - x), 6); }
    const f = easeOut((t - 7.3) / 0.3);
    if (f > 0) { g.strokeStyle = C.white; g.lineWidth = 5; g.lineCap = 'round';
      for (const hx of HOLES) { g.beginPath(); g.moveTo(hx, 324); g.lineTo(lerp(hx, G4[0], f), lerp(324, G4[1], f)); g.stroke(); } }
    g.fillStyle = C.navy; for (const hx of HOLES) g.fillRect(hx - 6, 318, 12, 8);
    rr(G4[0] - 30, G4[1] - 8, 60, 30, 10, C.sun);
    for (const [x, y, d] of [[1100, 770, 1], [1450, 530, -1]]) {
      circle(x, y, 70, C.sun); circle(x, y, 52, '#ffd36e'); const a = t * 5 * d;
      for (let k = 0; k < 3; k++) { g.save(); g.translate(x, y); g.rotate(a + k * 2.094); rr(-6, -46, 12, 46, 6, '#e0a12a'); g.restore(); }
      circle(x, y, 16, C.navy);
    }
  },
  front(t) {
    caption('熔体从细孔挤出，冷却后拉伸成丝', 1300, 1000, prog(t, 7.5, 7.8));
    title(5, '抽丝成再生纤维', C.violet, (t - 7.25) / 0.4);
  },
};

// ---------- S5 织成 T 恤 ----------
const SX = 960, SY = 540, PS = 0.45, PY = 50, HX = 960, HY = 770;
function shirtPath() {
  g.beginPath(); g.moveTo(SX - 150, SY - 360); g.lineTo(SX - 300, SY - 360); g.lineTo(SX - 620, SY - 230); g.lineTo(SX - 540, SY - 80); g.lineTo(SX - 440, SY - 150);
  g.lineTo(SX - 440, SY + 380); g.lineTo(SX + 440, SY + 380); g.lineTo(SX + 440, SY - 150); g.lineTo(SX + 540, SY - 80); g.lineTo(SX + 620, SY - 230);
  g.lineTo(SX + 300, SY - 360); g.lineTo(SX + 150, SY - 360); g.quadraticCurveTo(SX, SY - 250, SX - 150, SY - 360); g.closePath();
}
const ROWS = 8, ROW_H = 92.5, W0 = 9.1, W1 = 9.95;
const rowY = j => SY + 380 - ROW_H * (j + .5);
const rowW = j => rowY(j) > SY - 150 ? 440 : 600;
function weaveHead(t) {
  const u = clamp((t - W0) / (W1 - W0)) * ROWS, j = Math.min(ROWS - 1, Math.floor(u)), k = u - j, w = rowW(j);
  const x = j % 2 ? SX + w - 2 * w * k : SX - w + 2 * w * k;
  return { x, y: rowY(j) + Math.sin(k * PI) * -10, j, k: u >= ROWS ? 1 : k };
}
function printState(t) {
  let eye = 'open', look = [0.4, 0], mouth = 'smile';
  if (t < 10.32) { eye = 'happy'; mouth = 'grin'; }
  else if (t < 10.4) eye = 'blink';
  else if (t < 10.6) look = [-0.45, 0];
  else look = [lerp(-0.45, 0.4, prog(t, 10.6, 10.75)), 0];
  return { eye, look, mouth };
}
const S5 = {
  back(t) {
    ell(SX, SY + 402, 480, 28, 'rgba(0,0,0,.1)');
    shirtPath(); g.fillStyle = 'rgba(255,255,255,.28)'; g.fill();
    const solid = prog(t, 9.92, 10.2);
    if (t > W0) {
      const h = weaveHead(t);
      g.save(); shirtPath(); g.clip();
      for (let j = 0; j <= h.j; j++) {
        const y0 = SY + 380 - ROW_H * (j + 1) - (j === ROWS - 1 ? 200 : 0);
        let x0 = SX - 660, x1 = SX + 660;
        if (j === h.j && t < W1) { if (j % 2) x0 = h.x; else x1 = h.x; }
        g.fillStyle = C.teal; g.fillRect(x0, y0, x1 - x0, ROW_H + (j === ROWS - 1 ? 200 : 0) + 1);
        g.fillStyle = '#5ad7cb';
        for (let x = SX - 660 + (j % 2) * 30; x < x1; x += 60) if (x >= x0 - 30) g.fillRect(Math.max(x, x0), y0 + ROW_H * .3, Math.min(30, x1 - Math.max(x, x0)), ROW_H * .4);
      }
      g.restore();
    }
    if (solid > 0) {
      g.save(); g.globalAlpha = solid; shirtPath(); g.fillStyle = C.teal; g.fill();
      g.fillStyle = '#24a99c';
      poly([[SX - 620, SY - 230], [SX - 540, SY - 80], [SX - 516, SY - 93], [SX - 596, SY - 243]], '#24a99c');
      poly([[SX + 620, SY - 230], [SX + 540, SY - 80], [SX + 516, SY - 93], [SX + 596, SY - 243]], '#24a99c');
      g.fillRect(SX - 440, SY + 354, 880, 26);
      g.restore();
    }
    const kp = back((t - 10.05) / 0.3);
    if (kp > 0.001) {
      const st = printState(t);
      bottle(SX, SY + PY, PS * kp, st);
      const sa = clamp((t - 10.1) / 0.15) * (1 - clamp((t - 10.45) / 0.25));
      if (sa > 0) { g.save(); g.globalAlpha = sa; [[-95, -90, 24], [100, -50, 18], [-80, 20, 14], [88, -140, 13]].forEach(([dx, dy, s], i) => sparkle(SX + dx, SY + PY + dy, s * (1 + .3 * Math.sin(t * 20 + i)), C.white)); g.restore(); }
    }
  },
  front(t) {
    caption('瓶子和涤纶衣服，是同一种塑料：PET', SX, 1010, prog(t, 10.0, 10.3) * (1 - prog(t, 10.75, 11.1)));
    title(6, '织成一件 T 恤', C.pink, (t - 8.8) / 0.4);
  },
};
const SCENES = [S0, S1, S2, S3, S4, S5];

// ---------- hero across the whole journey (world coordinates) ----------
const YARN = [[8340, 600], [8780, 700], [9130, 460], [9600, 560], [9600 + SX - 440, rowY(0)]];
const YL = [0]; for (let i = 1; i < YARN.length; i++) YL.push(YL[i - 1] + Math.hypot(YARN[i][0] - YARN[i - 1][0], YARN[i][1] - YARN[i - 1][1]));
function yarnAt(s) { for (let i = 1; i < YARN.length; i++) if (s <= YL[i] || i === YARN.length - 1) { const k = clamp((s - YL[i - 1]) / (YL[i] - YL[i - 1])); return [lerp(YARN[i - 1][0], YARN[i][0], k), lerp(YARN[i - 1][1], YARN[i][1], k), i]; } }
const yarnS = t => YL[YL.length - 1] * clamp(easeIn(clamp((t - 7.6) / 0.25)) * 0.12 + (t - 7.6) / 1.5);
const blinkAt = t => [[0.2, 0.3], [2.4, 2.5], [5.3, 5.38], [8.1, 8.18]].some(([a, b]) => t > a && t < b);

function drawHero(t) {
  // S0: idle, two hops, leap into the bin
  if (t < 1.64) {
    let x = HX, y = HY, sy = 1, rot = 0, eye = blinkAt(t) ? 'blink' : 'open', mouth = 'smile';
    const hops = [[0.38, 0.76, HX, 1080], [0.76, 1.14, 1080, 1190]];
    for (const [a, b, x0, x1] of hops) if (t >= a && t < b) { const k = (t - a) / (b - a); x = lerp(x0, x1, k); y = HY + hopY(k, 70) + (800 - HY) * (b === 0.76 ? k : 1); sy = 1 + .12 * Math.sin(PI * k); }
    if (t >= 1.14 && t < 1.2) { x = 1190; y = 800; }
    if (t >= 0.76) sy -= 0.2 * spring(t - 0.76) * (t < 0.8 ? 1 : 0.6);
    if (t >= 1.14 && t < 1.2) sy -= 0.22 * Math.sin((t - 1.14) / 0.06 * PI / 2);
    if (t >= 1.2) { const k = clamp((t - 1.2) / 0.42); x = lerp(1190, BIN_X, k); y = 800 + hopY(k, 400); sy = 1 + .15 * Math.sin(PI * k); rot = .35 * Math.sin(PI * k); eye = 'happy'; mouth = 'grin'; }
    if (t >= 0.38 && t < 0.42) sy -= 0.15;
    bottle(x, y, 1, { sx: 1 / Math.sqrt(sy), sy, rot, eye, mouth, look: [0.4, 0] });
    return;
  }
  // S1: squeezed out of the pipe, rides the belt, scanned, blown into the suction funnel
  const o1 = 1920;
  if (t >= 2.02 && t < 3.56) {
    let x, y = BELT, sy = 1, sx = 1, rot = 0, eye = 'open', mouth = 'smile', look = [0.4, 0];
    if (t < 2.2) { const k = easeOut((t - 2.02) / 0.18); x = lerp(230, 360, k); sy = lerp(0.58, 1, k) - 0.0; sx = lerp(1.25, 1, k); eye = 'wow'; mouth = 'o'; }
    else if (t < 3.28) { x = 360 + D1(t); sy = 1 - 0.18 * spring(t - 2.2);
      if (t > 2.79 && t < 2.92) { eye = 'wow'; mouth = 'o'; look = [0, -0.6]; } else if (t >= 2.92 && t < 3.28) { eye = 'happy'; mouth = 'grin'; }
      if (blinkAt(t)) eye = 'blink'; }
    else { const k = easeIn((t - 3.28) / 0.28); x = lerp(1180, 1580, k); y = lerp(BELT, 410, k) - Math.sin(PI * k) * 60; rot = k * 2.4; sy = 1 + .2 * k; eye = 'wow'; mouth = 'o'; }
    bottle(o1 + x, y, 1, { sx: sx / Math.sqrt(sy), sy, rot, eye, mouth, look });
    return;
  }
  // S2: drops out of the pipe into the shredder, comes out as a dizzy flake, hops on
  const o2 = 3840;
  if (t >= 3.86 && t < 4.42) {
    let y, eye = 'wow', mouth = 'o', look = [0, 1], rot = 0, sy = 1;
    if (t < 4.12) { const k = easeOut((t - 3.86) / 0.26); y = lerp(300, 540, k); rot = Math.sin(t * 30) * .05; sy = 1 + .1 * (1 - k); }
    else if (t < 4.26) { y = 540 + Math.sin((t - 4.12) * 60) * 3; rot = Math.sin(t * 40) * .06; }
    else { const k = (t - 4.26) / 0.16; y = 540 + 1800 * k * k * .16; eye = 'blink'; mouth = 'flat'; }
    bottle(o2 + 870, y, 1, { sy, sx: 1 / Math.sqrt(sy), rot, eye, mouth, look });
    return;
  }
  if (t >= 4.62 && t < 5.62) {
    let x, y = 858, rot = 0, eye = 'open', mouth = 'smile', look = [0.6, 0], shY = 0;
    if (t < 4.8) { const k = (t - 4.62) / 0.18; x = lerp(1150, 1300, k); y = lerp(830, 858, k) + hopY(k, 120); rot = k * 4; eye = 'dizzy'; mouth = 'flat'; shY = 858 - y; }
    else if (t < 5.05) { x = 1300; rot = Math.sin((t - 4.8) * 30) * .25 * (1 - (t - 4.8) / .25); eye = (t < 4.98) ? 'dizzy' : 'blink'; mouth = t < 4.98 ? 'flat' : 'smile'; }
    else { const k = (t - 5.05) / 0.17, i = Math.min(2, Math.floor(k)), f = Math.min(1, k - i); x = 1300 + 316 * (i + f); y = 858 + hopY(f, 90); rot = Math.sin(f * PI) * .2; eye = 'happy'; mouth = 'grin'; shY = 858 - y; if (t > 5.56) { x = 2248; y = 858; eye = 'open'; } }
    flake(o2 + x, y, 1.1, rot, { eye, mouth, look, shY });
    return;
  }
  // S3: dives into the wash, then leaps into the melting pot and pops up as a molten blob
  const o3 = 5760;
  if (t >= 5.62 && t < 6.52) {
    let x, y, rot = 0, eye = 'happy', mouth = 'grin';
    if (t < 5.86) { const k = (t - 5.62) / 0.24; x = lerp(328, 600, k); y = lerp(858, 790, k) + hopY(k, 160); rot = k * 1.2; eye = 'wow'; mouth = 'o'; }
    else if (t < 6.2) { const k = (t - 5.86) / 0.34; x = lerp(600, 700, k); y = 790 + Math.sin(k * PI * 3) * 12; rot = 1.2 + Math.sin(k * PI * 2) * .3; }
    else { const k = (t - 6.2) / 0.32; x = lerp(700, 1375, k); y = lerp(790, 740, k) + hopY(k, 380); rot = 1.5 + k * 3; }
    flake(o3 + x, y, 1.1, rot, { eye, mouth, look: [0.6, 0], shY: 2000 });
    return;
  }
  if (t >= 6.55 && t < 7.1) {
    const up = easeOut((t - 6.55) / 0.22) * (1 - prog(t, 6.9, 7.08));
    blob(o3 + 1375, lerp(700, 548, up), 78, t, { eye: (t > 6.78 && t < 6.84) ? 'blink' : 'happy' });
    return;
  }
  // S4–S5: rides the yarn as its leading tip, then shuttles back and forth weaving the shirt
  if (t >= 7.58 && t < W0) {
    const s = yarnS(t), [x, y] = yarnAt(s), sc = back((t - 7.58) / 0.2);
    head(x, y - 2, 1.4 * sc, { eye: blinkAt(t) ? 'blink' : 'open', look: [1, 0.2] });
    return;
  }
  if (t >= W0 && t < 10.18) {
    const o5 = 9600;
    if (t < W1) { const h = weaveHead(t), dir = h.j % 2 ? -1 : 1; head(o5 + h.x, h.y, 1.4, { eye: 'happy', mouth: 'grin', look: [dir, 0] }); }
    else { const k = easeIn((t - W1) / 0.23), h = weaveHead(W1 - 1e-4); head(o5 + lerp(h.x, SX, k), lerp(h.y, SY + PY - 140, k), 1.4 * (1 - k), { eye: 'wow', mouth: 'o' }); }
  }
}
function drawYarn(t) {
  if (t < 7.58) return;
  const s = t < W0 ? yarnS(t) : YL[YL.length - 1], a = 1 - prog(t, 9.95, 10.25); if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.strokeStyle = C.white; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(YARN[0][0], YARN[0][1]);
  for (let i = 1; i < YARN.length && YL[i - 1] < s; i++) { const p = s >= YL[i] ? YARN[i] : yarnAt(s); g.lineTo(p[0], p[1]); }
  g.stroke(); g.restore();
}

window.__info = { fps: FPS, duration: DUR, frames: Math.round(FPS * DUR) };
window.__render = t => {
  const cx = camX(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const zk = ease((t - 10.6) / 1.4);
  if (zk > 0) {
    const Ze = 1 / PS, Z = Math.exp(zk * Math.log(Ze)), w = (Z - 1) / (Ze - 1);
    const Px = SX, Py = SY + PY, Ox = lerp(Px, HX, w), Oy = lerp(Py, HY, w);
    g.setTransform(Z, 0, 0, Z, Ox - Px * Z, Oy - Py * Z);
  }
  const base = g.getTransform();
  const vis = SCENES.map((s, i) => [s, i * 1920 - cx]).filter(([, ox]) => ox > -1920 && ox < 1920);
  for (const [s, ox] of vis) { g.save(); g.translate(ox, 0); g.beginPath(); g.rect(0, 0, 1920, 1080); g.clip(); g.fillStyle = BG[SCENES.indexOf(s)]; g.fillRect(0, 0, 1920, 1080); deco(SCENES.indexOf(s), t); s.back(t); g.restore(); }
  g.save(); g.translate(-cx, 0); drawFlakes(t); drawYarn(t); drawHero(t); g.restore();
  for (const [s, ox] of vis) { g.save(); g.translate(ox, 0); g.beginPath(); g.rect(0, 0, 1920, 1080); g.clip(); s.front(t); g.restore(); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  text('扁平 MG demo · 代码逐帧渲染', 40, 1050, 22, 'rgba(255,255,255,.6)', 400, 'left');
  return { seg: 'flatmg', tau: t.toFixed(2) };
};
window.__render(0);
document.fonts.load(`700 48px ${FONT}`).then(() => document.fonts.ready).then(() => { window.__render(0); window.__ready = true; });
</script>
