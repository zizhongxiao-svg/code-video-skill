<script>
const FPS = 30, DUR = 11;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const prog = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a) => t < a ? 0 : back((t - a) / 0.24);

const RED = '#e3262b', K = '#111', W = '#fff';
const SANS = '"Noto Sans CJK SC", sans-serif';
const PAN = {
  p1: [40, 40, 760, 540], p2: [784, 40, 1290, 540], p3: [1314, 40, 1880, 540],
  p4: [40, 564, 1150, 964], p5: [1174, 564, 1880, 964], page: [0, 0, 1920, 1004],

// ---------- drawing helpers ----------
function halftone(x0, y0, x1, y1, tone, sp = 10, col = K, ang = 0.7854) {
  const ca = Math.cos(ang), sa = Math.sin(ang), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const R = Math.hypot(x1 - x0, y1 - y0) / 2 + sp;
  const hp = new Path2D();
  for (let v = -R; v <= R; v += sp) for (let u = -R; u <= R; u += sp) {
    const x = cx + u * ca - v * sa, y = cy + u * sa + v * ca;
    if (x < x0 - sp || x > x1 + sp || y < y0 - sp || y > y1 + sp) continue;
    const tn = typeof tone === 'function' ? tone(x, y) : tone;
    if (tn <= 0.01) continue;
    const r = sp * Math.sqrt(clamp(tn, 0, 1.3) / Math.PI);
    hp.moveTo(x + r, y); hp.arc(x, y, r, 0, 6.2832);
  }

}
function withClip(pathFn, fn) { ctx.save(); ctx.beginPath(); pathFn(); ctx.clip(); fn(); ctx.restore(); }

}

  const lh = size * 1.25; lines.forEach((s, i) => ctx.fillText(s, cx, cy + (i - (lines.length - 1) / 2) * lh));
  ctx.restore();
}
function focusLines(cx, cy, r0, R, n, seed, alpha = 1) {
  const r = mulberry32(seed); ctx.fillStyle = `rgba(17,17,17,${alpha})`; ctx.beginPath();
  for (let i = 0; i < n; i++) {

}
function arrow(x0, y0, x1, y1, lw, head) {

function label(x, y, s, size, align = 'center') {

  ctx.lineWidth = 5; ctx.strokeStyle = K; ctx.stroke();
  ctx.save(); ctx.clip(); halftone(-r * 1.3, -r, r * 1.3, r * 1.1, (px, py) => clamp((px + py * 0.6) / r * 0.5 - 0.1, 0, 0.5), 7); ctx.restore();

    halftone(x - r, y - r, x + r, y + r, (px, py) => tone + clamp(((px - x) + (py - y)) / r * 0.35, 0, 0.5), 8);
    ctx.fillStyle = 'rgba(17,17,17,0.0)';

    halftone(x - r, y - r, x + r, y + r, (px, py) => 0.18 + clamp(((px - x) + (py - y)) / r * 0.3 + 0.15, 0, 0.6), 9);
    if (grid) { ctx.strokeStyle = K; ctx.lineWidth = 2.5; }

// ---------- cannonball trajectories (central gravity, v in units of circular speed) ----------
const EC = [1597, 314], ER = 100, R0 = 140;
const TRAJ = [0.6, 0.8, 0.88, 1.0].map(v => {
  const GM = R0; let x = 0, y = -R0, vx = v, vy = 0; const pts = [[x, y]]; let ang = 0, prev = Math.atan2(y, x);
  for (let i = 0; i < 4000; i++) {
    const r = Math.hypot(x, y), a = -GM / (r * r * r); vx += a * x; vy += a * y; x += vx; y += vy;
    const cur = Math.atan2(y, x); let d = cur - prev; if (d < -Math.PI) d += 6.2832; if (d > Math.PI) d -= 6.2832; ang += d; prev = cur;

// ---------- panels ----------
function panel1(t) {

  const ay0 = 196, ay1 = 418, fk = clamp((t - 0.45) / 0.7), ay = lerp(ay0, ay1, fk * fk), AX = 560;

  ctx.beginPath(); ctx.moveTo(x0, 175);

const STARS = (() => { const r = mulberry32(9), a = []; for (let i = 0; i < 26; i++) a.push([800 + r() * 470, 60 + r() * 300, 3 + r() * 6]); return a; })();
function panel2(t) {

  ctx.quadraticCurveTo(966, 458, 1000, 466); ctx.quadraticCurveTo(1040, 480, 1046, y1 + 10); ctx.closePath();
  ctx.fillStyle = K; ctx.fill();
  ctx.beginPath(); ctx.moveTo(904, 342);

// ---------- camera ----------
function fit(r, pad = 70) { const w = r[2] - r[0], h = r[3] - r[1]; return [(r[0] + r[2]) / 2, (r[1] + r[3]) / 2, Math.min(1920 / (w + pad), 1080 / (h + pad))]; }
const SHOTS = [[0, 1.9, 'p1'], [2.35, 3.8, 'p2'], [4.25, 6.2, 'p3'], [6.65, 8.3, 'p4'], [8.75, 9.9, 'p5'], [10.5, 11, 'page']];
function camera(t) {
  for (let i = 0; i < SHOTS.length; i++) {
    const [a, b, n] = SHOTS[i];
    const f = fit(PAN[n], n === 'page' ? 40 : 70);
    if (t <= b || i === SHOTS.length - 1) {
      if (t >= a || i === 0) { const push = 1 + 0.035 * clamp((t - a) / (b - a)); return [f[0], f[1], f[2] * (n === 'page' ? 1 : push)]; }
      const [pa, pb, pn] = SHOTS[i - 1]; const pf = fit(PAN[pn], 70); const pz = pf[2] * 1.035;
      const k = ease((t - pb) / (a - pb));
      return [lerp(pf[0], f[0], k), lerp(pf[1], f[1], k), Math.exp(lerp(Math.log(pz), Math.log(f[2]), k)) * (1 - 0.12 * Math.sin(Math.PI * k))];

}
